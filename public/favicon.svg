<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DeedOwl">
  <!-- body with ear tufts -->
  <path d="M13 9 L22 17 Q32 13 42 17 L51 9 L50 28 Q54 44 45 54 Q32 63 19 54 Q10 44 14 28 Z" fill="#2d55c4"/>
  <!-- eyes, looking down at the deed -->
  <circle cx="24.5" cy="27" r="8" fill="#f8fafc"/>
  <circle cx="39.5" cy="27" r="8" fill="#f8fafc"/>
  <circle cx="26.6" cy="31.6" r="3.6" fill="#0f172a"/>
  <circle cx="37.4" cy="31.6" r="3.6" fill="#0f172a"/>
  <circle cx="27.6" cy="30.4" r="1" fill="#f8fafc"/>
  <circle cx="38.4" cy="30.4" r="1" fill="#f8fafc"/>
  <!-- beak -->
  <path d="M29.6 33 L34.4 33 L32 37.2 Z" fill="#f59e0b"/>
  <!-- the deed -->
  <g transform="rotate(-6 32 48)">
    <path d="M21 39 H39.5 L43 42.5 V57 H21 Z" fill="#ffffff"/>
    <path d="M39.5 39 V42.5 H43 Z" fill="#cbd5e1"/>
    <rect x="24" y="44" width="14" height="1.8" rx=".9" fill="#94a3b8"/>
    <rect x="24" y="48" width="16" height="1.8" rx=".9" fill="#94a3b8"/>
    <rect x="24" y="52" width="10" height="1.8" rx=".9" fill="#94a3b8"/>
  </g>
  <!-- wings holding the deed -->
  <path d="M15 38 Q13 49 21 55 Q24 50 22.5 43 Q20 39 15 38 Z" fill="#1b3480"/>
  <path d="M49 38 Q51 49 43 55 Q40 50 41.5 43 Q44 39 49 38 Z" fill="#1b3480"/>
</svg>
