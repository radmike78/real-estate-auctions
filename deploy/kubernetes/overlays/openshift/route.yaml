# HTTPS using the router's certificate (edge TLS); plain HTTP redirects to HTTPS.
# Leave "host" out to get an automatic name like forced-sale-finder-<project>.apps.<cluster-domain>,
# or set your own domain (point its DNS at the router and add a certificate).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: forced-sale-finder
  annotations:
    # Don't hold slow or stalled connections open.
    haproxy.router.openshift.io/timeout: 30s
    # With Cloudflare in front (recommended): accept traffic only from Cloudflare, so nobody can bypass it
    # (space-separated; https://www.cloudflare.com/ips/, checked 2026-09). OpenShift 4.13 and older: ip_whitelist.
    # haproxy.router.openshift.io/ip_allowlist: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"
    # WITHOUT Cloudflare only: per-address limits at the router (behind Cloudflare every visitor shares a few addresses).
    # haproxy.router.openshift.io/rate-limit-connections: "true"
    # haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "50"
    # haproxy.router.openshift.io/rate-limit-connections.rate-http: "100"
spec:
  # host: forced-sale-finder.example.com
  to:
    kind: Service
    name: forced-sale-finder
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
