# OpenShift 4.x with a prebuilt image from a registry.
#   oc new-project forced-sale-finder
#   (create the Secret: see README "Deploy on OpenShift")
#   oc apply -k deploy/kubernetes/overlays/openshift
# OpenShift assigns the user ID and volume permissions itself (restricted-v2 SCC), so no patches needed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route.yaml
images:
  - name: forced-sale-finder
    newName: ghcr.io/radmike78/real-estate-auctions # your image
    newTag: latest
patches:
  # Only the OpenShift router may reach the pod, so no other pod in the cluster can call it directly
  # (and fake the X-Forwarded-For address it trusts).
  - target:
      kind: NetworkPolicy
      name: forced-sale-finder
    patch: |-
      - op: add
        path: /spec/ingress/0/from
        value:
          - namespaceSelector:
              matchLabels:
                policy-group.network.openshift.io/ingress: ""
