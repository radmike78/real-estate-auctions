# OpenShift 4.x, building the image inside the cluster from this Git repository (no registry account
# needed). Every successful build redeploys the site automatically.
#   oc new-project forced-sale-finder
#   (create the Secret: see README "Deploy on OpenShift", option B)
#   oc apply -k deploy/kubernetes/overlays/openshift-build
#   oc start-build forced-sale-finder --follow
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route.yaml
  - imagestream.yaml
  - buildconfig.yaml
images:
  - name: forced-sale-finder
    newName: forced-sale-finder
    newTag: latest
patches:
  # Only the OpenShift router may reach the pod, so no other pod in the cluster can call it directly
  # (and fake the X-Forwarded-For address it trusts).
  - target:
      kind: NetworkPolicy
      name: forced-sale-finder
    patch: |-
      - op: add
        path: /spec/ingress/0/from
        value:
          - namespaceSelector:
              matchLabels:
                policy-group.network.openshift.io/ingress: ""
  # Resolve "forced-sale-finder:latest" to the ImageStream, and redeploy when a new build lands.
  - target:
      kind: Deployment
      name: forced-sale-finder
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          image.openshift.io/triggers: >-
            [{"from":{"kind":"ImageStreamTag","name":"forced-sale-finder:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"},
             {"from":{"kind":"ImageStreamTag","name":"forced-sale-finder:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"ingest\")].image"}]
      - op: add
        path: /spec/template/metadata/annotations
        value:
          alpha.image.policy.openshift.io/resolve-names: "*"
