# HTTPS entry point. Change the host name (twice), and ingressClassName if your cluster doesn't use nginx.
# With cert-manager installed, the annotation below gets a free Let's Encrypt certificate automatically;
# change "letsencrypt" to the name of your ClusterIssuer. Without cert-manager, create the TLS secret yourself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forced-sale-finder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    # Don't hold slow or stalled connections open (the app's own limits are 15 s for headers, 30 s per request).
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # With Cloudflare in front (recommended): accept traffic only from Cloudflare, so nobody can bypass it.
    # Needs the ingress controller to see the connecting address (its Service with
    # externalTrafficPolicy: Local, or your cloud's load-balancer source ranges). Cloudflare's list:
    # https://www.cloudflare.com/ips/ (checked 2026-09).
    # nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
    # WITHOUT Cloudflare only: per-address limits at the ingress. Leave these off behind Cloudflare, where
    # every visitor arrives from a few Cloudflare addresses and would share one limit.
    # nginx.ingress.kubernetes.io/limit-rps: "20"
    # nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["forced-sale-finder.example.com"]
      secretName: forced-sale-finder-tls
  rules:
    - host: forced-sale-finder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forced-sale-finder
                port:
                  name: http
